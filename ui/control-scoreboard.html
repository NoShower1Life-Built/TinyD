<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TinyD — Control Loop Scoreboard</title>
<style>
:root{--bg:#090c10;--panel:#10151b;--line:#28323d;--text:#e7edf3;--muted:#8b98a6;--ok:#63d39a;--warn:#e5c66d;--bad:#ee7777;--info:#79aaf0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:225px 1fr}aside{background:#0a0e13;border-right:1px solid var(--line);padding:18px 12px}.brand{font-weight:800;font-size:18px;padding:4px 9px 20px}.brand b{color:var(--info)}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:6px;cursor:pointer}nav button:hover,nav button.active{background:#151c24;color:var(--text)}main{max-width:1500px;width:100%;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;margin-bottom:15px}h1{margin:0;font-size:24px}.sub{color:var(--muted)}.actions{display:flex;gap:7px}button.action{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 11px;border-radius:6px;cursor:pointer}.status{display:flex;justify-content:space-between;align-items:center;background:#151013;border:1px solid #5b3939;border-radius:8px;padding:15px 17px;margin-bottom:14px}.status strong{font-size:17px}.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}.info{color:var(--info)}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px}.card h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#aeb8c3;margin:0 0 12px}.metric{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.metric:last-child{border:0}.pipeline{display:flex;align-items:center;gap:6px;overflow:auto}.node{min-width:105px;background:#0c1116;border:1px solid var(--line);border-radius:6px;text-align:center;padding:8px}.node small{display:block;color:var(--muted);font-size:10px}.truth{display:grid;grid-template-columns:1fr auto}.truth div{padding:7px 0;border-bottom:1px solid var(--line)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{font-size:10px;color:var(--muted);text-transform:uppercase}.tag{border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:10px}.queue-row{display:grid;grid-template-columns:45px 1fr auto;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.queue-row:last-child{border:0}.inspect{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:5px;padding:4px 7px;cursor:pointer}.view{display:none}.view.active{display:block}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.dialog{max-width:620px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}@media(max-width:950px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow:auto}.g4,.g2{grid-template-columns:1fr}.top{flex-direction:column}}
</style></head>
<body><div class="app"><aside><div class="brand">Tiny<b>D</b> / CONTROL</div><nav id="nav"></nav></aside><main>
<div class="top"><div><h1 id="title">Control Loop Scoreboard</h1><div class="sub" id="meta">Loading repository state…</div></div><div class="actions"><button class="action" id="refresh">Re-evaluate</button><button class="action" id="compact">Compact</button></div></div>
<div id="app"></div></main></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogBody"></p><button class="action" id="close">Close</button></div></div>
<script>
const sections=["Overview","Batches","Control Model","Dependencies","Planner","Executions","Events","Evidence","Verification","Drift","Release"];
const nav=document.querySelector("#nav");sections.forEach((s,i)=>{const b=document.createElement("button");b.textContent=s;b.dataset.view=s.toLowerCase().replaceAll(" ","-");if(i===0)b.className="active";b.onclick=()=>select(b.dataset.view,b.textContent);nav.appendChild(b)});
let data=null,current="overview";
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
async function load(){meta.textContent="Loading repository state…";try{const r=await fetch("../scoreboard.json",{cache:"no-store"});if(!r.ok)throw new Error("scoreboard.json not found");data=await r.json();meta.textContent=`Source ${data.sourceRevision.slice(0,12)} · generated from repository`;render()}catch(e){meta.textContent="No generated scoreboard.json. Run: python3 scripts/scoreboard.py > scoreboard.json";app.innerHTML=`<section class="card"><h2>Scoreboard data unavailable</h2><p class="muted">This UI does not invent repository state. Generate the machine-derived data artifact first.</p><code>${esc(e.message)}</code></section>`}}
function render(){document.querySelector("#app").innerHTML=page(current);}
function page(v){if(v==='overview')return overview();if(v==='batches')return batches();if(v==='control-model')return controls();if(v==='dependencies')return dependencies();if(v==='planner')return queue();if(v==='executions')return empty("Executions","No authoritative execution records are present in the generated state.");if(v==='events')return empty("Events","No execution lifecycle events are present in the generated state.");if(v==='evidence')return evidence();if(v==='verification')return verification();if(v==='drift')return drift();return release()}
function overview(){return `<div class="status"><div><strong class="bad">● ${esc(data.status)}</strong><div class="muted">Repository-derived control state</div></div><div><span class="tag bad">${data.findings.filter(x=>x.severity==='CRITICAL').length} critical</span> <span class="tag warn">${data.findings.filter(x=>x.severity==='HIGH').length} high</span></div></div><div class="grid g4">${card('Requirements',data.counts.requirements,data.counts.verifiedRequirements,'Verified')} ${card('Tasks',data.counts.tasks,data.workQueue.filter(x=>x.state==='READY').length,'Ready')} ${card('Executions',data.counts.executions,0,'Succeeded')} ${card('Evidence',data.counts.validEvidence, data.counts.requirements-data.counts.validEvidence,'Missing')}</div><div class="card" style="margin-top:14px"><h2>Control Pipeline</h2><div class="pipeline">${['Requirement','Dependency','Planner','Execution','Event','Evidence','Verification','Canonical State','Release'].map((x,i)=>`<div class="node">${x}<small>${i<3?'PARTIAL':i===8?'BLOCKED':'OPEN'}</small></div>${i<8?'<span>→</span>':''}`).join('')}</div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h2>System Truth</h2><div class="truth">${Object.entries(data.truth).map(([k,v])=>`<div>${k}</div><div class="${v?'ok':'bad'}">${v?'YES':'NO'}</div>`).join('')}</div></div><div class="card"><h2>Blocking Drift</h2>${data.findings.map(f=>`<div class="metric"><span>${esc(f.message)}</span><span class="tag ${f.severity==='CRITICAL'?'bad':'warn'}">${f.severity}</span></div>`).join('')}</div></div><div class="card" style="margin-top:14px"><h2>Machine Work Queue</h2>${queueRows(data.workQueue)}</div>`}
function card(title,a,b,label){return `<div class="card"><h2>${title}</h2><div class="metric"><span>Total</span><b>${a}</b></div><div class="metric"><span>${label}</span><b>${b}</b></div></div>`}
function queueRows(q){return q.map(x=>`<div class="queue-row"><b>#${String(x.position).padStart(3,'0')}</b><span>${esc(x.title)}<small class="muted" style="display:block">${esc(x.state)}${x.blockers?.length?' · blocked by '+x.blockers.join(', '):''}</small></span><button class="inspect" data-item='${esc(JSON.stringify(x))}'>inspect</button></div>`).join('')}
function batches(){return `<div class="card"><h2>Batch Control</h2><table><tr><th>Batch</th><th>State</th><th>Present</th><th>Missing</th></tr>${data.batches.map(b=>`<tr><td>${b.id} — ${esc(b.title)}</td><td class="${b.state==='CLOSED'?'ok':b.state==='PARTIAL'?'warn':'bad'}">${b.state}</td><td>${b.present.length}</td><td>${b.missing.length}</td></tr>`).join('')}</table></div>`}
function controls(){return `<div class="card"><h2>Control Predicates</h2><table><tr><th>Predicate</th><th>State</th></tr>${Object.entries(data.controls).map(([k,v])=>`<tr><td>${k}</td><td class="${v?'ok':'bad'}">${v?'PASS':'FAIL'}</td></tr>`).join('')}</table></div>`}
function dependencies(){return `<div class="card"><h2>Dependency Evaluation</h2>${data.workQueue.map(x=>`<div class="metric"><span>${x.taskId} — ${esc(x.title)}</span><span class="${x.state==='BLOCKED'?'bad':'ok'}">${x.state}</span></div>`).join('')}</div>`}
function queue(){return `<div class="card"><h2>Ordered Work Queue</h2>${queueRows(data.workQueue)}</div>`}
function empty(t,m){return `<div class="card"><h2>${t}</h2><p class="muted">${m}</p></div>`}
function evidence(){return `<div class="card"><h2>Evidence Ledger</h2><div class="metric"><span>Valid</span><b class="ok">${data.counts.validEvidence}</b></div><div class="metric"><span>Missing</span><b class="bad">${data.counts.requirements-data.counts.validEvidence}</b></div></div>`}
function verification(){return `<div class="card"><h2>Verification</h2><div class="metric"><span>Evidence-backed verification</span><b class="bad">${data.counts.verifiedRequirements}</b></div><div class="metric"><span>Current source proven</span><b class="bad">${data.truth.CURRENT?'YES':'NO'}</b></div></div>`}
function drift(){return `<div class="card"><h2>Drift Findings</h2>${data.findings.map(f=>`<div class="metric"><span>${esc(f.message)}</span><span class="tag ${f.severity==='CRITICAL'?'bad':'warn'}">${f.severity}</span></div>`).join('')}</div>`}
function release(){return `<div class="card" style="text-align:center;padding:25px"><h2>Release Gate</h2><h1 class="bad">${esc(data.status)}</h1>${data.releaseReasons.map(x=>`<p class="muted">✕ ${esc(x)}</p>`).join('')}</div>`}
function select(v,label){current=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.querySelector('#title').textContent=label;render()}
document.addEventListener('click',e=>{if(e.target.matches('.inspect')){const x=JSON.parse(e.target.dataset.item);dialogTitle.textContent=x.taskId+' — '+x.title;dialogBody.textContent=`State: ${x.state}. Dependencies: ${(x.dependsOn||[]).join(', ')||'none'}. Blocking reasons: ${(x.blockingReasons||[]).join(', ')||'none'}.`;modal.classList.add('open')}});close.onclick=()=>modal.classList.remove('open');refresh.onclick=load;compact.onclick=()=>document.body.classList.toggle('compact');load();
</script></body></html>
