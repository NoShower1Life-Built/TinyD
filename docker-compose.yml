services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tinyd
      POSTGRES_USER: tinyd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tinyd-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinyd -d tinyd"]
      interval: 5s
      timeout: 5s
      retries: 10

  tinyd-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://tinyd:${POSTGRES_PASSWORD}@postgres:5432/tinyd
      TINYD_CORS_ORIGINS: ${TINYD_CORS_ORIGINS:-http://127.0.0.1:8080}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tinyd-postgres:
