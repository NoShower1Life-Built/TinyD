name: Control Validation

on:
  push:
    branches: [main, 'feat/**', 'refine/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate control model
        run: python3 scripts/control_validate.py
      - name: Run executable control tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate dependency-aware queue
        run: python3 scripts/plan.py
      - name: Generate repository-derived scoreboard
        env:
          TINYD_SOURCE_REVISION: ${{ github.sha }}
        run: python3 scripts/scoreboard.py > scoreboard.json
      - name: Upload scoreboard
        uses: actions/upload-artifact@v4
        with:
          name: tinyd-scoreboard-${{ github.sha }}
          path: scoreboard.json
          if-no-files-found: error
