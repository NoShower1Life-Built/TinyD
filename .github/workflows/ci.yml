name: TinyD CI

on:
  push:
    branches: [main, tinyd-v1.0-scaffold, feat/scoreboard-assurance-v1]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TINYD_TENANT_SIGNING_KEY: ci-only-test-key-not-a-secret
      TINYD_DISABLE_API_DOCS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q apps packages tests
      - name: Import API
        run: python -c "from apps.api.main import app; assert app.title == 'TinyD API'"
      - name: Execute tests
        run: python -m pytest -q
