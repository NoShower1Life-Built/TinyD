name: TinyD CI

on:
  push:
    branches: [main, tinyd-v1.0-scaffold]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Phase-1 event store gate
        run: PYTHONPATH=packages/event-store python -m pytest packages/event-store/tests -q
