name: TinyD CI

on:
  push:
    branches: [main, tinyd-v1.0-scaffold, refine/control-model-state-planner, 'phase2/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tinyd
          POSTGRES_PASSWORD: tinyd
          POSTGRES_DB: tinyd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tinyd -d tinyd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest 'psycopg[binary]'
      - name: Event store and runtime integration gate
        env:
          TINYD_TEST_DATABASE_URL: postgresql://tinyd:tinyd@127.0.0.1:5432/tinyd_test
        run: |
          PYTHONPATH=packages/event-store python -m pytest packages/event-store/tests -q
          PYTHONPATH=packages/runtime python -m pytest packages/runtime/tests -q

