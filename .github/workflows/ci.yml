name: TinyD CI

on:
  push:
    branches: [main, tinyd-v1.0-scaffold, feat/tinyd-ai-agent-contracts, fix/production-gate-corrective]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TINYD_ALLOW_DESTRUCTIVE_TEST_DB_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile Python sources
        run: python -m compileall apps packages tests
      - name: Execute API and runtime tests
        run: pytest -q
