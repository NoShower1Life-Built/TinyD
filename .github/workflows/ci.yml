name: TinyD CI

on:
  push:
    branches: [main, tinyd-v1.0-scaffold]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tinyd
          POSTGRES_PASSWORD: tinyd_test_password
          POSTGRES_DB: tinyd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tinyd -d tinyd_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://tinyd:tinyd_test_password@localhost:5432/tinyd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile Python sources
        run: python -m compileall apps packages tests
      - name: Execute API and runtime tests
        run: pytest -q
