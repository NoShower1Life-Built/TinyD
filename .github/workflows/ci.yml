name: TinyD CI

on:
  push:
    branches: [main, tinyd-v1.0-scaffold, feat/scoreboard-assurance-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TINYD_TENANT_SIGNING_KEY: ci-only-test-key-0123456789-abcdef
      TINYD_DISABLE_API_DOCS: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q apps packages tests
      - name: Import API
        run: python -c "from apps.api.main import app; assert app.title == 'TinyD API'"
      - name: Execute unit and contract tests
        run: python -m pytest -q --ignore=tests/integration
