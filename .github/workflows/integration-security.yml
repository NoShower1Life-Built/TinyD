name: TinyD Integration Security

on:
  push:
    branches: [main, feat/scoreboard-assurance-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: tinyd
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_DB: tinyd
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tinyd -d tinyd"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      kafka:
        image: bitnami/kafka:3.8
        env:
          KAFKA_CFG_NODE_ID: 1
          KAFKA_CFG_PROCESS_ROLES: broker,controller
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
          ALLOW_PLAINTEXT_LISTENER: "yes"
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://tinyd:ci-postgres-only@127.0.0.1:5432/tinyd
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      TINYD_TENANT_SIGNING_KEY: ci-only-test-key-0123456789-abcdef
      TINYD_DISABLE_API_DOCS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt
      - name: Wait for PostgreSQL and Kafka
        run: |
          for i in {1..30}; do pg_isready -h 127.0.0.1 -p 5432 -U tinyd -d tinyd && break; sleep 2; done
          python - <<'PY'
          import socket, time
          for _ in range(30):
              try:
                  s=socket.create_connection(('127.0.0.1',9092),2); s.close(); print('Kafka ready'); break
              except OSError: time.sleep(2)
          else: raise SystemExit('Kafka did not become reachable')
          PY
      - name: Apply every migration to a clean PostgreSQL database
        run: |
          set -euo pipefail
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort -V); do
            echo "Applying $migration"
            PGPASSWORD=ci-postgres-only psql "$DATABASE_URL" --set ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Exercise tenant RLS
        run: python tests/integration/test_postgres_rls.py
      - name: Validate evidence hash chain and recorded replay verification
        run: python tests/integration/test_postgres_evidence_replay.py
      - name: Exercise real Kafka event transport
        run: python tests/integration/test_kafka_event_transport.py
