name: TinyD Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' build
      - name: Compile Python sources
        run: python -m compileall -q apps packages tests
      - name: Build Python distribution
        run: python -m build
      - name: Run test suite
        run: pytest -q

  container-build:
    name: Build container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile -t tinyd-gate:${{ github.sha }} .
      - name: Validate compose configuration
        run: docker compose config

  api-integration:
    name: API integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run marketplace API integration tests
        run: pytest -q tests/test_marketplace.py

  browser-render:
    name: Browser render smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start static marketplace server
        run: |
          python -m http.server 4173 --directory apps/marketplace > /tmp/tinyd-browser.log 2>&1 &
          echo $! > /tmp/tinyd-browser.pid
      - name: Render marketplace and capture screenshot
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 1000}, device_scale_factor=1)
              page.goto("http://127.0.0.1:4173/index.html", wait_until="networkidle")
              assert page.title() == "TinyD Marketplace"
              assert page.locator("h1").count() == 1
              page.screenshot(path="marketplace-render.png", full_page=True)
              browser.close()
          PY
      - name: Upload browser render evidence
        uses: actions/upload-artifact@v4
        with:
          name: tinyd-marketplace-browser-render
          path: marketplace-render.png
